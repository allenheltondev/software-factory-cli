AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Updraft Cloud -- the hosted Updraft at updraft.readysetcloud.io. One origin: the SPA on S3 at /
  and the API at /api/*, both through one CloudFront distribution. The API is an API Gateway REST
  API with a Cognito authorizer on the shared Ready, Set, Cloud user pool (this stack adds its own
  app client to that pool).

Parameters:
  ClaudeImageDeploymentRoleName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_+=,.@-]{1,64}$'
    Description: Existing GitHub deployment role that builds and verifies the Claude image.
  ManagedClaudeImageName:
    Type: String
    Default: updraft-native-claude
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Name of the dedicated disposable Claude worker image.
  ManagedClaudeImageVersion:
    Type: String
    Default: ''
    Description: Built, live-verified browser-login image version. A nonempty value enables tenant-managed Claude sessions.
  ManagedClaudeConsoleOrigin:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[A-Za-z0-9.-]+$'
    Description: Public console origin for issue sign-in links when the console uses its CloudFront domain.
  NativeWorkerRoute:
    Type: String
    Default: ''
    Description: Operator-only JSON worker binding. Published triggers are selected in the console. Empty disables subscription dispatch.
  NativeWorkerBrowserSignIn:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable browser sign-in only for a validated disposable worker image and binding.
  NativeWorkerImageArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:lambda:[^:]+:[0-9]{12}:microvm-image:.+$'
    Description: Dedicated native test image ARN; never the shared BYOK image.
  NativeWorkerControlSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:updraft/native-workers/.+$'
    Description: Root worker control credential under updraft/native-workers/; never Claude credentials.
  AuthUserPoolId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /readysetcloud/auth/user-pool-id
    Description: >
      SSM parameter holding the shared Ready, Set, Cloud user pool id (rsc-core). People sign in
      with their existing RSC account.
  AuthUserPoolArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /readysetcloud/auth/user-pool-arn
    Description: SSM parameter holding the same pool's ARN, for the API's Cognito authorizer.

  ApiStageName:
    Type: String
    Default: prod
    AllowedPattern: '^[a-zA-Z0-9_]+$'
    Description: The API Gateway stage. CloudFront's api origin adds it as OriginPath.
  ApiRateLimit:
    Type: Number
    Default: 50
    Description: Steady-state requests per second for the whole stage (API Gateway throttling).
  ApiBurstLimit:
    Type: Number
    Default: 100
    Description: Burst capacity for the whole stage.
  WebhookRateLimit:
    Type: Number
    Default: 20
    Description: Steady-state requests per second for the GitHub webhook route alone.
  WebhookBurstLimit:
    Type: Number
    Default: 40
    Description: Burst capacity for the GitHub webhook route alone.

  # Quotas (server/src/jobs/quotas.ts): every tenant's defaults; an admin overrides them per
  # tenant (scripts/tenant-admin.ts limits set). The platform's ceiling counts every tenant's jobs.
  QuotaConcurrentJobs:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Jobs one tenant may run at once.
  QuotaJobsPerDay:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Jobs one tenant may start per UTC day.
  QuotaMicrovmMinutesPerMonth:
    Type: Number
    Default: 1200
    MinValue: 1
    Description: MicroVM minutes one tenant may use per UTC month (a job is charged its maximum duration at start, then refunded what it did not use).
  ResultRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: How long a job's result document and logs are kept (tenants/<id>/results/; the daily cleanup deletes what is older).
  PlatformConcurrentJobs:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Jobs every tenant together may run at once.
  # The agents tenants may configure: the ones the job image ships (deploy/aws-microvm,
  # image/build.env: AGENT_PACKAGES for Claude Code and Codex, KIRO_INSTALL_COMMAND for Kiro).
  CloudAgents:
    Type: String
    Default: claude,codex
    AllowedPattern: '^(claude|codex|kiro)(,(claude|codex|kiro))*$'
    Description: Comma-separated agents tenants may run (claude, codex, kiro). List only the ones the job image ships.
  # Agent Timeline has no documented link to a conversation (tenants/telemetry-service.ts):
  # empty, and the console links to the conversation's query instead.
  HoneycombTimelineUrl:
    Type: String
    Default: ''
    MaxLength: 512
    Description: "A template for a link to a conversation in Honeycomb's Agent Timeline, starting with {ui}/{team}/ and naming {conversation} (also {environment}, {dataset}, {start}, {end}). Empty: no such link."

  # The admin view (server/src/admin/access.ts): the members of this group in the shared Ready,
  # Set, Cloud user pool, from the ID token's cognito:groups.
  AdminGroup:
    Type: String
    Default: updraft-admins
    MinLength: 1
    MaxLength: 128
    Description: The Cognito group whose members may use Updraft's admin view.

  AppDomainName:
    Type: String
    Default: ''
    Description: >
      Optional hostname for the app, e.g. updraft.readysetcloud.io. With AppHostedZoneId, the stack
      issues an ACM certificate for it (DNS validated in that zone), adds it to the distribution and
      points A/AAAA alias records at the distribution. Empty (every non-production deploy) serves
      on the *.cloudfront.net domain only. CloudFront certificates must be in us-east-1, as this
      stack is.
  AppHostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 hosted zone that holds AppDomainName's parent domain.

Rules:
  ManagedClaudeReferences:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref ManagedClaudeImageVersion, '']
          - !Not [!Equals [!Ref AppDomainName, '']]
          - !Not [!Equals [!Ref ManagedClaudeConsoleOrigin, '']]
        AssertDescription: Managed Claude requires a public console origin for GitHub issue links.
  NativeWorkerReferences:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref NativeWorkerRoute, '']
          - !And
            - !Not [!Equals [!Ref NativeWorkerImageArn, '']]
            - !Not [!Equals [!Ref NativeWorkerControlSecretArn, '']]
        AssertDescription: Enabling the native test route requires its dedicated image and control secret ARNs.

Conditions:
  ClaudeImageDeployment: !Not [!Equals [!Ref ClaudeImageDeploymentRoleName, '']]
  ManagedClaude: !Not [!Equals [!Ref ManagedClaudeImageVersion, '']]
  ManagedClaudeOriginOverride: !Not [!Equals [!Ref ManagedClaudeConsoleOrigin, '']]
  NativeWorkerBrowserLogin: !And
    - !Condition NativeWorkerEnabled
    - !Equals [!Ref NativeWorkerBrowserSignIn, 'true']
  NativeWorkerEnabled: !And
    - !Not [!Equals [!Ref NativeWorkerRoute, '']]
    - !Not [!Equals [!Ref NativeWorkerImageArn, '']]
    - !Not [!Equals [!Ref NativeWorkerControlSecretArn, '']]
  DeployCustomDomain: !And
    - !Not [!Equals [!Ref AppDomainName, '']]
    - !Not [!Equals [!Ref AppHostedZoneId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Environment:
      Variables:
        # What tenants may configure and the console offers (server/src/tenants/agents.ts).
        CLOUD_AGENTS: !Ref CloudAgents
    Architectures:
      - arm64
    Tracing: Active

Resources:
  ClaudeImageDeploymentPolicy:
    Type: AWS::IAM::Policy
    Condition: ClaudeImageDeployment
    Properties:
      PolicyName: !Sub ${AWS::StackName}-claude-image-release
      Roles: [!Ref ClaudeImageDeploymentRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:GetMicrovmImage
              - lambda:GetMicrovmImageVersion
              - lambda:TagResource
              - lambda:UpdateMicrovmImage
              - lambda:RunMicrovm
              - lambda:GetMicrovm
              - lambda:CreateMicrovmAuthToken
              - lambda:TerminateMicrovm
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt ManagedClaudeExecutionRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  ManagedClaudeControlSecret:
    Type: AWS::SecretsManager::Secret
    Condition: ManagedClaude
    Properties:
      Description: Root key for deriving disposable per-session broker credentials
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ManagedClaudeExecutionRole:
    Type: AWS::IAM::Role
    # Provision before activation so the image smoke test uses the tenant runtime role.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: worker-broker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BrokerFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}:*

  ManagedClaudeWebhookName:
    Type: AWS::SSM::Parameter
    Condition: ManagedClaude
    Properties:
      Name: !Sub /updraft/${AWS::StackName}/claude-webhook
      Type: String
      Value: !Ref WebhookFunction

  # ---------------------------------------------------------------------------
  # Data: one table, generic keys and two overloaded GSIs so tenants, members, config versions,
  # deliveries and jobs (#67-#71) fit without a table replacement. Retained on stack delete.
  # ---------------------------------------------------------------------------
  UpdraftTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # No point-in-time recovery, by decision (same as ai-fantasy-league's table). The deploy role
      # has no dynamodb:UpdateContinuousBackups either.
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # Auth: this app's own client in the shared pool. The SPA signs in with
  # @readysetcloud/ui/auth, which calls cognito-idp directly (USER_PASSWORD_AUTH), so the client
  # has no secret and no hosted UI. The pool's shared client lacks USER_PASSWORD_AUTH.
  # ---------------------------------------------------------------------------
  AuthClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-app
      UserPoolId: !Ref AuthUserPoolId
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      # An ID token lives an hour; the SPA refreshes it silently (getFreshIdToken) for as long as
      # the refresh token lasts.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------------------
  # The API: API Gateway REST (regional; CloudFront is the only edge) with the Cognito authorizer
  # as the default on every route. The authorizer verifies the ID token's signature, issuer and
  # expiry; it accepts any client in the shared pool, so ApiFunction also checks `aud` against
  # AuthClient. Routes live under /api because CloudFront forwards /api/* paths unchanged.
  # ---------------------------------------------------------------------------
  UpdraftApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref ApiStageName
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      # Same origin as the SPA: no CORS configuration on purpose.
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref AuthUserPoolArn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ApiRateLimit
          ThrottlingBurstLimit: !Ref ApiBurstLimit
          MetricsEnabled: true
        # The webhook route's own limit (API Gateway escapes "/" in a resource path as "~1").
        - ResourcePath: '/~1api~1webhooks~1github'
          HttpMethod: POST
          ThrottlingRateLimit: !Ref WebhookRateLimit
          ThrottlingBurstLimit: !Ref WebhookBurstLimit
          MetricsEnabled: true
      # No access or execution logging yet: both need the account-level API Gateway CloudWatch
      # role (AWS::ApiGateway::Account), which this stack does not own. Metrics need no role.
      GatewayResponses:
        # The authorizer's own refusals, as JSON in the same shape the API answers with.
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error":"unauthorized"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error":"forbidden"}'
        THROTTLED:
          StatusCode: 429
          ResponseTemplates:
            application/json: '{"error":"throttled"}'
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error":"bad_request"}'
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error":"internal_error"}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Bundled by `npm run build --workspace=server` (server/scripts/bundle.mjs). `sam deploy`
      # zips this directory itself, so there is no `sam build` step.
      CodeUri: ../server/dist
      Handler: index.handler
      MemorySize: 512
      # CloudFront waits at most 30s for the origin by default; long work belongs elsewhere.
      Timeout: 29
      Environment:
        Variables:
          TABLE_NAME: !Ref UpdraftTable
          NATIVE_WORKER_ROUTE: !Ref NativeWorkerRoute
          NATIVE_MANAGED_IMAGE_ARN: !If [ManagedClaude, !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}', ""]
          NATIVE_MANAGED_IMAGE_VERSION: !Ref ManagedClaudeImageVersion
          NATIVE_MANAGED_SECRET_ARN: !If [ManagedClaude, !Ref ManagedClaudeControlSecret, ""]
          NATIVE_MANAGED_ROLE_ARN: !If [ManagedClaude, !GetAtt ManagedClaudeExecutionRole.Arn, ""]
          NATIVE_MANAGED_LOG_GROUP: !If [ManagedClaude, !Ref MicrovmLogGroup, ""]
          BROKER_FUNCTION_NAME: !Ref BrokerFunction
          NATIVE_WORKER_LOGIN_IMAGE_ARN: !If [NativeWorkerBrowserLogin, !Ref NativeWorkerImageArn, ""]
          # Tenant config bundles: the console publishes them (tenants/config-service.ts).
          TENANT_BUCKET: !Ref TenantBucket
          USER_POOL_ID: !Ref AuthUserPoolId
          USER_POOL_CLIENT_ID: !Ref AuthClient
          # When a job's logs count as expired (tenants/status-service.ts): the cleanup's own setting.
          RESULT_RETENTION_DAYS: !Ref ResultRetentionDays
          # A link to a job's conversation in Agent Timeline, when set (tenants/telemetry-service.ts).
          HONEYCOMB_TIMELINE_URL: !Ref HoneycombTimelineUrl
          # The admin view shows each tenant's quotas: the same defaults the launcher applies.
          QUOTA_CONCURRENT_JOBS: !Ref QuotaConcurrentJobs
          QUOTA_JOBS_PER_DAY: !Ref QuotaJobsPerDay
          QUOTA_MICROVM_MINUTES_PER_MONTH: !Ref QuotaMicrovmMinutesPerMonth
          PLATFORM_CONCURRENT_JOBS: !Ref PlatformConcurrentJobs
          # Who may use the admin view: the members of this Cognito group (server/src/admin/access.ts).
          ADMIN_GROUP: !Ref AdminGroup
          # Retrying a job from the console: the launcher lives in the webhook function (jobs/retry.ts).
          WEBHOOK_FUNCTION_NAME: !Ref WebhookFunction
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - !If
          - ManagedClaude
          - Statement:
              - Effect: Allow
                Action: [lambda:GetMicrovm, lambda:RunMicrovm, lambda:CreateMicrovmAuthToken]
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ManagedClaudeExecutionRole.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ManagedClaudeControlSecret
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref UpdraftTable
        - !If
          - NativeWorkerBrowserLogin
          - Statement:
              - Effect: Allow
                Action: [lambda:GetMicrovm, lambda:CreateMicrovmAuthToken]
                Resource: !Ref NativeWorkerImageArn
          - !Ref AWS::NoValue
        # Only this one function, and only to run a retry the API has already authorized.
        - LambdaInvokePolicy:
            FunctionName: !Ref WebhookFunction
        # The GitHub App's settings (github/settings.ts), written by scripts/register-github-app.mjs.
        - SSMParameterReadPolicy:
            ParameterName: updraft/app/*
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/app/*
            # Config bundles only: never a tenant's state, events or results. It reads only files
            # a version lists, so it needs no ListBucket.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*/config/*
            # A job's logs for the console (tenants/status-service.ts): read only, results only.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*/results/*
            # Insights (tenants/stats-service.ts): the shared state database, read only. Only
            # the one object, never the databases a failed sync left beside it.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*/state/state.db
            # Writing a tenant's agent keys (tenants/agent-keys.ts). Write-only: this function can
            # create and replace them, never read one back.
            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:TagResource
                - secretsmanager:DeleteSecret
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/tenants/*/agent-keys/*
            # Write-only API trigger tokens from Anthropic's scheduled-tasks UI.
            - Effect: Allow
              Action:
                - secretsmanager:CreateSecret
                - secretsmanager:PutSecretValue
                - secretsmanager:TagResource
                - secretsmanager:DeleteSecret
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/tenants/*/routine-triggers/*
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref UpdraftApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
        V1:
          Type: Api
          Properties:
            RestApiId: !Ref UpdraftApi
            Path: /api/v1/{proxy+}
            Method: ANY

  # The GitHub webhook (flows/webhook.ts). No authorizer: the HMAC over the raw body, keyed with the
  # App's webhook secret, is the authentication. Its own function, so its own concurrency and
  # throttling (WebhookRateLimit on the route). It is also the multi-tenant launcher (jobs/launch.ts):
  # a tenant's labeled issue starts a job microVM.
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../server/dist
      Handler: webhook.handler
      MemorySize: 512
      # GitHub gives up after 10 s; a launch that takes longer still completes.
      Timeout: 20
      Environment:
        Variables:
          TABLE_NAME: !Ref UpdraftTable
          TENANT_BUCKET: !Ref TenantBucket
          PARTITION: !Ref AWS::Partition
          JOB_IMAGE_ARN: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${AWS::StackName}-job
          JOB_IMAGE_VERSION_PARAMETER: !Sub /updraft/${AWS::StackName}/job-image-version
          EXECUTION_ROLE_ARN: !GetAtt MicrovmExecutionRole.Arn
          NATIVE_WORKER_ROUTE: !Ref NativeWorkerRoute
          NATIVE_MANAGED_IMAGE_ARN: !If [ManagedClaude, !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}', ""]
          NATIVE_MANAGED_IMAGE_VERSION: !Ref ManagedClaudeImageVersion
          NATIVE_MANAGED_SECRET_ARN: !If [ManagedClaude, !Ref ManagedClaudeControlSecret, ""]
          CLAUDE_CONSOLE_ORIGIN: !If
            - ManagedClaude
            - !If [ManagedClaudeOriginOverride, !Ref ManagedClaudeConsoleOrigin, !Sub 'https://${AppDomainName}']
            - ''
          BROKER_FUNCTION_NAME: !Ref BrokerFunction
          MICROVM_LOG_GROUP: !Ref MicrovmLogGroup
          # Agent timeouts are capped at 120 minutes and verify at 30 (tenants/config.ts).
          MAX_DURATION_SECONDS: '10800'
          WATCHDOG_RESERVE_SECONDS: '600'
          QUOTA_CONCURRENT_JOBS: !Ref QuotaConcurrentJobs
          QUOTA_JOBS_PER_DAY: !Ref QuotaJobsPerDay
          QUOTA_MICROVM_MINUTES_PER_MONTH: !Ref QuotaMicrovmMinutesPerMonth
          PLATFORM_CONCURRENT_JOBS: !Ref PlatformConcurrentJobs
          # Not created by the stack (a deploy must never turn it off): see README, "The kill switch".
          KILL_SWITCH_PARAMETER: /updraft/kill-switch
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - !If
          - ManagedClaude
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ManagedClaudeControlSecret
              - Effect: Allow
                Action: s3:PutObjectTagging
                Resource: !Sub ${TenantBucket.Arn}/tenants/*/events/claude-wait/*
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref UpdraftTable
        - SSMParameterReadPolicy:
            ParameterName: updraft/app/*
        - SSMParameterReadPolicy:
            ParameterName: !Sub updraft/${AWS::StackName}/job-image-version
        - !If
          - NativeWorkerEnabled
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref NativeWorkerControlSecretArn
          - !Ref AWS::NoValue
        - SSMParameterReadPolicy:
            ParameterName: updraft/kill-switch
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/app/*
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/tenants/*/routine-triggers/*
            # The event a job reads, under its tenant's prefix. Read back only to run a job again
            # from the console (jobs/retry.ts).
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*/events/*
            # A config version published before its key needs were recorded: the launcher reads
            # them from its config.yaml (tenants/key-needs.ts). Config bundles only.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*/config/*
            - Effect: Allow
              Action: lambda:RunMicrovm
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${AWS::StackName}-job
            # RunMicrovm is given the Lambda-provided NO_INGRESS and INTERNET_EGRESS connectors, and
            # AWS authorizes passing them separately. The action has no resource type in IAM, so a
            # statement scoped to the connector ARNs would never match: it takes "*".
            - Effect: Allow
              Action: lambda:PassNetworkConnector
              Resource: '*'
            # RunMicrovm is given the execution role; passing a role needs iam:PassRole on exactly it.
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt MicrovmExecutionRole.Arn
      Events:
        GitHub:
          Type: Api
          Properties:
            RestApiId: !Ref UpdraftApi
            Path: /api/webhooks/github
            Method: POST
            Auth:
              Authorizer: NONE

  # The uninstall retention deadline for what DynamoDB TTL cannot reach (tenants/cleanup.ts):
  # once a day, the S3 prefix and agent key secrets of every uninstalled tenant past its deadline.
  # A tenant that fails is retried the next day (its cleanup entry stays).
  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../server/dist
      Handler: cleanup.handler
      MemorySize: 256
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref UpdraftTable
          TENANT_BUCKET: !Ref TenantBucket
          RESULT_RETENTION_DAYS: !Ref ResultRetentionDays
          NATIVE_WORKER_ROUTE: !Ref NativeWorkerRoute
          NODE_OPTIONS: --enable-source-maps
      Policies:
        - !If
          - ManagedClaude
          - Statement:
              - Effect: Allow
                Action: [lambda:GetMicrovm, lambda:TerminateMicrovm]
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy:
            TableName: !Ref UpdraftTable
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt TenantBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: tenants/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${TenantBucket.Arn}/tenants/*
            - Effect: Allow
              Action: secretsmanager:DeleteSecret
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/tenants/*
            # ListSecrets does not support resource-level permissions; enumerate only the
            # target tenant's named routine-trigger prefix in cleanup-lambda.ts.
            - Effect: Allow
              Action: secretsmanager:ListSecrets
              Resource: '*'
            # Quota reconciliation: a job's capacity is freed once its microVM shows TERMINATED.
            - !If
              - NativeWorkerEnabled
              - Effect: Allow
                Action: [lambda:GetMicrovm, lambda:TerminateMicrovm]
                Resource: !Ref NativeWorkerImageArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: lambda:GetMicrovm
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${AWS::StackName}-job
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Description: Delete uninstalled tenants' S3 data and key secrets past their deadline
            ScheduleExpression: cron(23 4 * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 2
        Reconcile:
          Type: ScheduleV2
          Properties:
            Description: Free the quota slots of jobs whose microVM has terminated (server/src/jobs/reconcile.ts)
            ScheduleExpression: rate(5 minutes)
            Input: '{"task":"reconcile"}'
            RetryPolicy:
              MaximumRetryAttempts: 0

  # ---------------------------------------------------------------------------
  # Tenant data (#68): everything a tenant's jobs read and write, under tenants/<installationId>/
  #   config/<version>/   immutable config bundles (server/src/tenants/publish.ts)
  #   state/, results/    the shared state database and job results (the job broker, next)
  # Private; only the platform's roles reach it, and a job reaches only its own tenant's prefix
  # (the broker's scoped credentials).
  # ---------------------------------------------------------------------------
  TenantBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireClaudeSignInEvents
            Status: Enabled
            TagFilters:
              - Key: updraft-retention
                Value: claude-wait
            ExpirationInDays: 2
      # Object ownership is left at S3's default for new buckets (bucket owner enforced, ACLs off).

  TenantBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TenantBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TenantBucket.Arn
              - !Sub ${TenantBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # ---------------------------------------------------------------------------
  # Jobs (#68): every tenant's jobs run in microVMs with one execution role, which therefore reaches
  # no tenant's data. A job's runner invokes the job broker (server/src/broker/broker.ts) with its
  # single-use job token and gets back what that one job may have: AWS credentials from JobDataRole
  # with a session policy for its tenant's prefix and key secrets, and an installation token for its
  # one repository. The App's private key never enters a microVM. WebhookFunction is the launcher;
  # the image is built by server/scripts/build-job-image.ts.
  # ---------------------------------------------------------------------------
  BrokerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: broker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Jobs and their tenants only: read a job and its tenant, mark a job started or
              # finished, count its microVM time in the tenant's usage, and check a job is not
              # released before holding its slots.
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt UpdraftTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - 'JOB#*'
                      - 'TENANT#*'
                      - 'NATIVE#*'
              # A delivery's claim and a job's quota slots (the tenant's and the platform's): a
              # started job holds them for its lifetime (start, conditional PutItems in one
              # transaction with its microVM time), and finish frees them (conditional DeleteItems).
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt UpdraftTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys:
                      - 'DELIVERY#*'
                      - 'TENANT#*'
                      - 'PLATFORM#*'
                      - 'NATIVE#*'
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt UpdraftTable.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: !If [ManagedClaude, ['NATIVE#*', 'TENANT#*'], ['NATIVE#*']]
              - !If
                - NativeWorkerEnabled
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref NativeWorkerControlSecretArn
                - !Ref AWS::NoValue
              - !If
                - NativeWorkerEnabled
                - Effect: Allow
                  Action: [lambda:GetMicrovm, lambda:TerminateMicrovm]
                  Resource: !Ref NativeWorkerImageArn
                - !Ref AWS::NoValue
              - !If
                - ManagedClaude
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref ManagedClaudeControlSecret
                - !Ref AWS::NoValue
              - !If
                - ManagedClaude
                - Effect: Allow
                  Action: [lambda:GetMicrovm, lambda:TerminateMicrovm]
                  Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}
                - !Ref AWS::NoValue
              - !If
                - ManagedClaude
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/updraft/${AWS::StackName}/claude-webhook
                - !Ref AWS::NoValue
              - !If
                - ManagedClaude
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-WebhookFunction-*
                - !Ref AWS::NoValue
              # The kill switch: while it is on, nothing but finish and terminate is served.
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/updraft/kill-switch
              - Effect: Allow
                Action: ssm:GetParameter*
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/updraft/app/*
              # The App's private key, to mint installation tokens. It stays in the broker.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/app/*
              # A job's own microVM, the one the launcher recorded for it (the terminate action),
              # and its state: the job's quota slots are freed once it is seen stopping.
              - Effect: Allow
                Action:
                  - lambda:TerminateMicrovm
                  - lambda:GetMicrovm
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${AWS::StackName}-job

  # Separate from BrokerRole, which JobDataRole's trust policy names (an inline policy would be a cycle).
  BrokerAssumeJobDataPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: assume-job-data
      Roles:
        - !Ref BrokerRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: !GetAtt JobDataRole.Arn

  # Never used as it is: the broker assumes it with a session policy for one job (jobSessionPolicy),
  # and AWS intersects the two. What it allows here is the most any job's credentials could have.
  JobDataRole:
    Type: AWS::IAM::Role
    Properties:
      # Role chaining caps a session at an hour anyway; the runner asks for new credentials.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BrokerRole.Arn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tenant-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${TenantBucket.Arn}/tenants/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TenantBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: tenants/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:updraft/tenants/*

  BrokerFunction:
    Type: AWS::Serverless::Function
    DependsOn: BrokerAssumeJobDataPolicy
    Properties:
      CodeUri: ../server/dist
      Handler: broker.handler
      Role: !GetAtt BrokerRole.Arn
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref UpdraftTable
          TENANT_BUCKET: !Ref TenantBucket
          JOB_DATA_ROLE_ARN: !GetAtt JobDataRole.Arn
          NATIVE_WORKER_ROUTE: !Ref NativeWorkerRoute
          NATIVE_MANAGED_IMAGE_ARN: !If [ManagedClaude, !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ManagedClaudeImageName}', ""]
          NATIVE_MANAGED_IMAGE_VERSION: !Ref ManagedClaudeImageVersion
          NATIVE_MANAGED_SECRET_ARN: !If [ManagedClaude, !Ref ManagedClaudeControlSecret, ""]
          CLAUDE_WEBHOOK_PARAMETER: !If [ManagedClaude, !Sub '/updraft/${AWS::StackName}/claude-webhook', ""]
          PARTITION: !Ref AWS::Partition
          ACCOUNT_ID: !Ref AWS::AccountId
          KILL_SWITCH_PARAMETER: /updraft/kill-switch
          NODE_OPTIONS: --enable-source-maps

  # Runtime logs of the job microVMs (one stream per microVM), with a retention period.
  MicrovmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda-microvms/${AWS::StackName}-job
      RetentionInDays: 30

  # Assumed by Lambda for a running microVM. Everything in a microVM, agents included, must be
  # assumed able to use it, so it reaches no tenant's data and no other microVM: it can ask the
  # broker for one job's data or to stop that job's microVM (with that job's token), and write logs.
  MicrovmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: job
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # No lambda:TerminateMicrovm: it is authorised against the image, so it would let one
              # tenant's runner stop another's microVM. The broker stops a job's own microVM instead.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BrokerFunction.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # The group and its streams. Spelled out rather than !GetAtt MicrovmLogGroup.Arn,
                # which needs logs:DescribeLogGroups, and the deploy role does not have it.
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}:*

  # The job image's build contexts (cloud/scripts/build-job-image.mjs uploads one per build). Nothing
  # tenant-related is here; old contexts expire.
  JobImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-build-contexts
            Status: Enabled
            Prefix: image/
            ExpirationInDays: 30

  # Assumed by Lambda while it builds the job image: read the build context, write build logs.
  MicrovmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${JobImageBucket.Arn}/image/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${MicrovmLogGroup}:*

  # ---------------------------------------------------------------------------
  # Hosting: a private S3 bucket and one CloudFront distribution with two origins, so the browser
  # sees a single origin for the app and the API (no CORS, relative /api/v1 paths).
  # ---------------------------------------------------------------------------
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AppOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-app-oac
        Description: Signs CloudFront's reads of the SPA bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AppBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AppDistribution}

  # SPA fallback as a viewer-request rewrite on the default behavior only. Distribution-wide
  # CustomErrorResponses would also turn the API's own 401/403/404s into a 200 carrying
  # index.html; a function is per-behavior, so /api/* is left untouched.
  SpaRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-spa-router
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless paths to /index.html for client-side routing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  # The custom domain (Production). CloudFormation writes the DNS validation record itself and
  # waits for the certificate before the distribution uses it.
  AppCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: DeployCustomDomain
    Properties:
      DomainName: !Ref AppDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref AppDomainName
          HostedZoneId: !Ref AppHostedZoneId

  # A and AAAA: the distribution serves IPv6. Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id
  # for alias targets.
  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: DeployCustomDomain
    Properties:
      HostedZoneId: !Ref AppHostedZoneId
      Name: !Ref AppDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt AppDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AppDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: DeployCustomDomain
    Properties:
      HostedZoneId: !Ref AppHostedZoneId
      Name: !Ref AppDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt AppDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AppDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Updraft Cloud (${AWS::StackName}) -- SPA + API
        HttpVersion: http2and3
        Aliases: !If [DeployCustomDomain, [!Ref AppDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - DeployCustomDomain
          - AcmCertificateArn: !Ref AppCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        Origins:
          - Id: spa
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt AppOriginAccessControl.Id
            # Required-but-empty when OAC is in use.
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            # The regional execute-api host; OriginPath adds the stage, so the viewer's
            # /api/v1/me reaches the stage as /api/v1/me.
            DomainName: !Sub ${UpdraftApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            OriginPath: !Sub /${ApiStageName}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized. Vite emits content-hashed asset names; index.html and
          # auth-config.json are uploaded no-cache and invalidated by `make deploy-frontend`.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed SecurityHeadersPolicy (HSTS, nosniff, frame options, ...).
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouterFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed CachingDisabled.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed AllViewerExceptHostHeader: forwards every viewer header (Authorization,
            # X-Hub-Signature-256), cookie and query string, but lets CloudFront set Host to the
            # execute-api domain, which API Gateway requires.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # No CustomErrorResponses on purpose -- see SpaRouterFunction above.

Outputs:
  AppUrl:
    Description: >
      The deployment's one public URL -- SPA at /, API at /api. The custom domain when one is
      configured, the CloudFront domain otherwise.
    Value: !If
      - DeployCustomDomain
      - !Sub https://${AppDomainName}
      - !Sub https://${AppDistribution.DomainName}
  AppBucket:
    Description: S3 bucket the built SPA is synced into (private; read only via CloudFront OAC)
    Value: !Ref AppBucket
  AppDistributionId:
    Description: CloudFront distribution id (for `aws cloudfront create-invalidation`)
    Value: !Ref AppDistribution
  AppDistributionDomainName:
    Description: The distribution's *.cloudfront.net domain (Staging's AppUrl)
    Value: !GetAtt AppDistribution.DomainName
  ApiUrl:
    Description: The API stage's own execute-api URL (CloudFront's api origin); browsers use AppUrl/api
    Value: !Sub https://${UpdraftApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}
  UserPoolId:
    Description: The shared Ready, Set, Cloud user pool
    Value: !Ref AuthUserPoolId
  UserPoolClientId:
    Description: This stack's app client on that pool; `make deploy-frontend` publishes it in /auth-config.json
    Value: !Ref AuthClient
  TableName:
    Description: The Updraft Cloud table
    Value: !Ref UpdraftTable
  TenantBucket:
    Description: Tenant config bundles, state and results, under tenants/<installationId>/
    Value: !Ref TenantBucket
  BrokerFunctionName:
    Description: The job broker; a job's runner invokes it with its job token
    Value: !Ref BrokerFunction
  MicrovmExecutionRoleArn:
    Description: The one execution role of every job microVM (it reaches no tenant's data itself)
    Value: !GetAtt MicrovmExecutionRole.Arn
  ManagedClaudeExecutionRoleArn:
    Description: Execution role used by managed Claude sessions and the Claude release smoke test
    Value: !GetAtt ManagedClaudeExecutionRole.Arn
  JobImageName:
    Description: The MicroVM image jobs run (server/scripts/build-job-image.ts builds it)
    Value: !Sub ${AWS::StackName}-job
  JobImageArn:
    Description: The image's ARN, which the MicroVMs API takes as its identifier (not the name)
    Value: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${AWS::StackName}-job
  JobImageBucket:
    Description: Where the image build uploads its build context
    Value: !Ref JobImageBucket
  JobImageBuildRoleArn:
    Description: Role Lambda assumes while building the job image
    Value: !GetAtt MicrovmBuildRole.Arn
  JobImageVersionParameter:
    Description: SSM parameter with the image version the launcher runs; jobs are off until it exists
    Value: !Sub /updraft/${AWS::StackName}/job-image-version
  MicrovmLogGroup:
    Description: Build and runtime logs of the job microVMs (one stream per microVM)
    Value: !Ref MicrovmLogGroup
