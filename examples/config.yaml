# Example factory config. `factory configure` writes one like this to your
# per-user config location; `factory validate --config <file>` checks it.
version: 1
pollIntervalSeconds: 60
maxConcurrent: 2

execution:
  # log-only: record each run in run.log. prepare-only: also create a branch and
  # worktree per job (needs checkoutPath). live: also run the agent in the worktree
  # (needs checkoutPath and an action prompt). Only the Claude Code adapter ships in
  # this release, so live mode validates only with codex and kiro disabled:
  #
  #   execution: { mode: live }
  #   agents:
  #     codex: { enabled: false }
  #     claude: { maxConcurrent: 1 }   # runs `claude -p` in full-auto (bypassPermissions)
  #     kiro: { enabled: false }
  mode: log-only

dispatch:
  allowedActors: [allenheltondev]

# Logins whose PR reviews carry a trusted factory-review block (see docs/review-result.md).
# Empty (the default) trusts no review result.
review:
  reviewers: [allenheltondev]

agents:
  codex:
    maxConcurrent: 1
  claude:
    maxConcurrent: 1
    # Live mode only: the CLI to run instead of the one found on PATH, extra arguments,
    # and environment variables for the agent process. Arguments go after the adapter's
    # own; a --permission-mode here replaces the full-auto default (see the README).
    # command: /usr/local/bin/claude
    # args: [--model, sonnet, --max-turns, "60"]
    # args: [--permission-mode, acceptEdits, --allowedTools, "Bash(npm test *)", "Bash(git add *)", "Bash(git commit *)"]
    # env: { CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32000" }
  kiro:
    maxConcurrent: 1

pools:
  art:
    agents: [codex]
  general:
    agents: [claude, kiro]
    strategy: round-robin

actions:
  implement-issue:
    prompt: ./prompts/implement-issue.md
    output: local-branch
    # timeoutMinutes: 60 # live mode: stop the agent and fail the run after this long

repositories:
  allenheltondev/kids-and-dragons:
    id: 1 # replaced with the real GitHub repository ID by `factory add` / `configure`
    # Local clone that per-job worktrees branch from (relative to this file); required in prepare-only and live mode.
    # checkoutPath: ../clones/kids-and-dragons
    # baseBranch: main # defaults to the remote's default branch
    # remote: origin # only needed when the GitHub remote uses an SSH host alias (git@github-work:OWNER/REPO)
    # Live mode: push the job branch of a succeeded run and open a PR as your gh account (none, draft-pr or pr).
    # publish: draft-pr
    workflows:
      - id: implement
        trigger:
          event: issue.labeled
          label: "ready"
        action: implement-issue
        pool:
          rules:
            - hasLabel: art
              use: art
          default: general
