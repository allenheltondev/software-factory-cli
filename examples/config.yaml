# Example factory config. `factory configure` writes one like this to your
# per-user config location; `factory validate --config <file>` checks it.
version: 1
pollIntervalSeconds: 60
maxConcurrent: 2

execution:
  mode: log-only # live agent execution is not available yet

dispatch:
  allowedActors: [allenheltondev]

agents:
  codex:
    maxConcurrent: 1
  claude:
    maxConcurrent: 1
  kiro:
    maxConcurrent: 1

pools:
  art:
    agents: [codex]
  general:
    agents: [claude, kiro]
    strategy: round-robin

actions:
  implement-issue:
    prompt: ./prompts/implement-issue.md
    output: local-branch

repositories:
  allenheltondev/kids-and-dragons:
    id: 1 # replaced with the real GitHub repository ID by `factory add` / `configure`
    workflows:
      - id: implement
        trigger:
          event: issue.labeled
          label: "factory:ready"
        action: implement-issue
        pool:
          rules:
            - hasLabel: art
              use: art
          default: general
