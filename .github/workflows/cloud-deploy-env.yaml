name: Deploy Updraft Cloud (one environment)

# Called by cloud-production.yaml (push to main) and cloud-staging.yaml (pull requests). One job:
# check the code, deploy the stack and the SPA, then run the anonymous smoke checks against the
# result. Staging and Production are the same stack name in two AWS accounts; the environment's
# AWS_DEPLOYMENT_ROLE_ARN secret picks the account.
#
# One-time setup per GitHub environment (Settings > Environments):
#   secret   AWS_DEPLOYMENT_ROLE_ARN   an IAM role this repo may assume through GitHub OIDC
#   variable HOSTED_ZONE_ID        Production only: the readysetcloud.io Route 53 hosted zone id
#   variable ENABLE_MANAGED_CLAUDE Production only: explicit opt-in for the owner pilot
# Until the secret exists the job skips with a notice instead of failing.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (Production or Staging)
        required: true
        type: string
      domain:
        description: Custom domain to serve on; empty serves on the CloudFront domain
        required: false
        type: string
        default: ''
      build_image:
        description: Rebuild the worker images even if their inputs are unchanged
        required: false
        type: boolean
        default: false
      deploy_claude:
        description: Deploy the Claude worker image after it passes the AWS smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      app_url: ${{ steps.outputs.outputs.app_url }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.outputs.outputs.app_url }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: cloud
    env:
      STACK_NAME: updraft-cloud
      DEPLOY_REGION: us-east-1
    steps:
      - name: Check deploy prerequisites
        id: gate
        working-directory: .
        env:
          AWS_DEPLOYMENT_ROLE_ARN: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
        run: |
          if [ -z "${AWS_DEPLOYMENT_ROLE_ARN}" ]; then
            echo "::notice title=${{ inputs.environment }} deploy skipped::The ${{ inputs.environment }} environment has no AWS_DEPLOYMENT_ROLE_ARN secret. Add it (Settings > Environments > ${{ inputs.environment }}) to deploy Updraft Cloud."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json

      # The server bundles the CLI's config schema from src/ (zod), so the CLI's dependencies too.
      - name: Install the CLI's dependencies
        if: steps.gate.outputs.ready == 'true'
        working-directory: .
        run: npm ci

      - name: Check
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - uses: aws-actions/setup-sam@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-UpdraftCloud-${{ inputs.environment }}
          aws-region: us-east-1

      - name: Deploy the stack
        if: steps.gate.outputs.ready == 'true'
        env:
          APP_DOMAIN_NAME: ${{ inputs.domain }}
          APP_HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          OFFERED_AGENTS: ${{ vars.CLOUD_AGENTS }}
          AWS_DEPLOYMENT_ROLE_ARN: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
        run: |
          export CLAUDE_IMAGE_DEPLOYMENT_ROLE_NAME="${AWS_DEPLOYMENT_ROLE_ARN##*/}"
          if [ -n "$OFFERED_AGENTS" ]; then
            if [[ ! "$OFFERED_AGENTS" =~ ^(claude|codex|kiro|vibe)(,(claude|codex|kiro|vibe))*$ ]]; then
              echo "::error::CLOUD_AGENTS must be a comma-separated list of supported agent names."
              exit 1
            fi
            export CLOUD_AGENTS="$OFFERED_AGENTS"
          fi
          if [ -n "${APP_DOMAIN_NAME}" ]; then
            if [ -z "${APP_HOSTED_ZONE_ID}" ]; then
              echo "::error title=No hosted zone::Set the ${{ inputs.environment }} environment's HOSTED_ZONE_ID variable to the hosted zone that holds ${APP_DOMAIN_NAME}."
              exit 1
            fi
            make deploy-backend STACK_NAME="${STACK_NAME}" DEPLOY_REGION="${DEPLOY_REGION}" \
              APP_DOMAIN_NAME="${APP_DOMAIN_NAME}" APP_HOSTED_ZONE_ID="${APP_HOSTED_ZONE_ID}"
          else
            make deploy-backend STACK_NAME="${STACK_NAME}" DEPLOY_REGION="${DEPLOY_REGION}"
          fi

      - name: Deploy the SPA
        if: steps.gate.outputs.ready == 'true'
        run: make deploy-frontend STACK_NAME="${STACK_NAME}" DEPLOY_REGION="${DEPLOY_REGION}"

      - name: Read stack outputs
        id: outputs
        if: steps.gate.outputs.ready == 'true'
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --region "${DEPLOY_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          echo "app_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/smoke.mjs --url "${{ steps.outputs.outputs.app_url }}"

      - name: Diagnose a failed deploy
        if: failure() && steps.gate.outputs.ready == 'true'
        run: |
          echo "==== describe-stack-events (latest 50) ===="
          aws cloudformation describe-stack-events --stack-name "${STACK_NAME}" --region "${DEPLOY_REGION}" \
            --query "StackEvents[:50].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

  # The job MicroVM image (cloud/server/scripts/build-job-image.ts), after the stack it reads its
  # outputs from. A build takes a long time, so it runs only when the active image was not built
  # from what this checkout would build: each version records a fingerprint of its inputs
  # (cloud/server/scripts/job-image-inputs.ts), compared with this checkout's. That also covers an
  # environment with no image yet, a build that failed earlier, and a Staging stack last built by
  # another pull request. build_image builds regardless. Everything else deploys without it.
  image:
    name: Job image for ${{ inputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: updraft-cloud
      DEPLOY_REGION: us-east-1
    steps:
      - name: Check deploy prerequisites
        id: gate
        env:
          AWS_DEPLOYMENT_ROLE_ARN: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
        run: echo "ready=$([ -n "${AWS_DEPLOYMENT_ROLE_ARN}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-UpdraftCloud-Image-${{ inputs.environment }}
          aws-region: us-east-1

      - name: Was the active image built from this checkout?
        id: check
        if: steps.gate.outputs.ready == 'true'
        working-directory: cloud
        env:
          FORCE: ${{ inputs.build_image }}
        run: |
          npm ci
          if [ "${FORCE}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "build requested"; exit 0
          fi
          npm run build-job-image --workspace=server -- --stack "${STACK_NAME}" --region "${DEPLOY_REGION}" --check

      - name: Note an unchanged image
        if: steps.check.outputs.build == 'false'
        env:
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          echo "Job image: not rebuilt (${REASON})" >> "$GITHUB_STEP_SUMMARY"

      # npm pack builds the CLI (prepack) that goes into the image; the script runs from cloud/.
      - name: Build and publish the job image
        if: steps.check.outputs.build == 'true'
        run: |
          npm ci
          (cd cloud && npm run build-job-image --workspace=server -- --stack "${STACK_NAME}" --region "${DEPLOY_REGION}")
          echo "Job image: built and published ($(aws ssm get-parameter --name "/updraft/${STACK_NAME}/job-image-version" --region "${DEPLOY_REGION}" --query Parameter.Value --output text))" >> "$GITHUB_STEP_SUMMARY"

  claude-image:
    name: Claude subscription image for ${{ inputs.environment }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      STACK_NAME: updraft-cloud
      DEPLOY_REGION: us-east-1
    steps:
      - name: Check deploy prerequisites
        id: gate
        env:
          AWS_DEPLOYMENT_ROLE_ARN: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
        run: echo "ready=$([ -n "$AWS_DEPLOYMENT_ROLE_ARN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json

      - uses: aws-actions/configure-aws-credentials@6.2.2
        if: steps.gate.outputs.ready == 'true'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-UpdraftCloud-Claude-${{ inputs.environment }}
          aws-region: us-east-1

      - name: Build and verify the Claude subscription image
        id: claude
        if: steps.gate.outputs.ready == 'true'
        env:
          FORCE: ${{ inputs.build_image }}
        run: |
          npm ci
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          cd cloud
          npm ci
          npm run build-job-image --workspace=server -- --native-claude --stack "$STACK_NAME" --region "$DEPLOY_REGION" "${args[@]}"

      - name: Record the verified Claude image
        if: steps.claude.outputs.version != ''
        env:
          VERIFIED_VERSION: ${{ steps.claude.outputs.version }}
        run: echo "Claude subscription image verified ($VERIFIED_VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/setup-sam@v3
        if: steps.claude.outputs.version != '' && (inputs.deploy_claude || (inputs.environment == 'Production' && vars.ENABLE_MANAGED_CLAUDE == 'true'))
        with:
          use-installer: true

      - name: Deploy the verified Claude subscription image
        if: steps.claude.outputs.version != '' && (inputs.deploy_claude || (inputs.environment == 'Production' && vars.ENABLE_MANAGED_CLAUDE == 'true'))
        working-directory: cloud
        env:
          VERIFIED_VERSION: ${{ steps.claude.outputs.version }}
          CONSOLE_ORIGIN: ${{ needs.deploy.outputs.app_url }}
          CUSTOM_DOMAIN: ${{ inputs.domain }}
        run: |
          # A custom domain already has an origin in IaC. Staging uses its CloudFront URL.
          if [ -n "$CUSTOM_DOMAIN" ]; then CONSOLE_ORIGIN=""; fi
          active=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$DEPLOY_REGION" \
            --query "Stacks[0].Parameters[?ParameterKey=='ManagedClaudeImageVersion'].ParameterValue | [0]" --output text)
          origin=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$DEPLOY_REGION" \
            --query "Stacks[0].Parameters[?ParameterKey=='ManagedClaudeConsoleOrigin'].ParameterValue | [0]" --output text)
          if [ "$VERIFIED_VERSION" != "$active" ] || [ "$CONSOLE_ORIGIN" != "$origin" ]; then
            make deploy-backend MANAGED_CLAUDE_IMAGE_VERSION="$VERIFIED_VERSION" MANAGED_CLAUDE_CONSOLE_ORIGIN="$CONSOLE_ORIGIN"
          fi
          echo "Claude subscription image deployed ($VERIFIED_VERSION)" >> "$GITHUB_STEP_SUMMARY"
