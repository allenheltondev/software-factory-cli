name: Deploy Updraft Cloud to Production

# updraft.readysetcloud.io. Runs when main changes anything Updraft Cloud is built from.
on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      # The server bundles the CLI's config schema and agent profiles from src/.
      - 'src/config/**'
      - 'src/agents/**'
      # The job image (cloud-deploy-env.yaml rebuilds it only when these change).
      - 'deploy/aws-microvm/image/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-*.yaml'
  workflow_dispatch:
    inputs:
      build_image:
        description: Build the job image even if nothing it is built from changed
        type: boolean
        default: false

concurrency:
  group: updraft-cloud-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    uses: ./.github/workflows/cloud-deploy-env.yaml
    permissions:
      id-token: write
      contents: read
    with:
      environment: Production
      domain: updraft.readysetcloud.io
      build_image: ${{ inputs.build_image == true }}
    secrets: inherit
