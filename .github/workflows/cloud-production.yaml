name: Deploy Updraft Cloud to Production

# updraft.readysetcloud.io. Runs when main changes anything Updraft Cloud is built from.
on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      # The Claude image packages the CLI from this checkout.
      - 'src/**'
      - 'tsconfig*.json'
      - 'scripts/copy-telemetry.mjs'
      # The job image (cloud-deploy-env.yaml rebuilds it when the active one was built from other inputs).
      - 'deploy/aws-microvm/image/**'
      - 'deploy/aws-microvm/native-worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloud-*.yaml'
  workflow_dispatch:
    inputs:
      build_image:
        description: Rebuild the worker images even if their inputs are unchanged
        type: boolean
        default: false

concurrency:
  group: updraft-cloud-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    uses: ./.github/workflows/cloud-deploy-env.yaml
    permissions:
      id-token: write
      contents: read
    with:
      environment: Production
      domain: updraft.readysetcloud.io
      build_image: ${{ inputs.build_image == true }}
    secrets: inherit
