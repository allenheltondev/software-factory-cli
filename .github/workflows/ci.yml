name: CI

on:
  # Branch pushes are covered by pull_request. Running both posts two sets of the same
  # required check names on one commit, and a cancelled or failed duplicate blocks the merge.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Pack smoke test
        run: node scripts/pack-smoke.mjs

      # Launchers: render or register them against the built CLI with paths containing spaces.
      - name: Launchers (Windows Task Scheduler)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in Get-ChildItem examples\launchers\windows\*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_.ToString() } }
            Write-Host "parsed $($f.Name)"
          }
          $cfgDir = Join-Path $env:RUNNER_TEMP 'launcher cfg dir'
          $home2 = Join-Path $env:RUNNER_TEMP 'launcher updraft home'
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          Copy-Item examples\config.yaml (Join-Path $cfgDir 'config.yaml')
          $task = "Updraft CI $env:GITHUB_RUN_ID-${{ matrix.node }}"
          .\examples\launchers\windows\register-task.ps1 -TaskName $task -NoStart `
            -ConfigPath (Join-Path $cfgDir 'config.yaml') -CliPath (Join-Path $PWD 'dist\cli.js') -UpdraftHome $home2
          try {
            $xml = Export-ScheduledTask -TaskName $task
            foreach ($expected in @(
                '<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>',
                '<MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>',
                '<RestartOnFailure>',
                '<StartWhenAvailable>true</StartWhenAvailable>',
                '<LogonTrigger>',
                '<Interval>PT5M</Interval>',
                '<LogonType>InteractiveToken</LogonType>')) {
              if (-not $xml.Contains($expected)) { throw "task XML is missing $expected`n$xml" }
            }
            Write-Host 'task definition ok'
          } finally {
            .\examples\launchers\windows\unregister-task.ps1 -TaskName $task -UpdraftHome $home2
          }

      - name: Launchers (macOS LaunchAgent)
        if: runner.os == 'macOS'
        run: |
          bash -n examples/launchers/macos/install-launchagent.sh
          plutil -lint examples/launchers/macos/updraft.plist.template
          out="$RUNNER_TEMP/launcher out dir"
          mkdir -p "$out"
          bash examples/launchers/macos/install-launchagent.sh --print --label ci.updraft \
            --cli "$PWD/dist/cli.js" --config "$RUNNER_TEMP/launcher cfg dir/config.yaml" \
            --updraft-home "$RUNNER_TEMP/launcher updraft home" > "$out/ci.plist"
          plutil -lint "$out/ci.plist"
          plutil -p "$out/ci.plist"

      - name: Launchers (systemd user unit)
        if: runner.os == 'Linux'
        run: |
          bash -n examples/launchers/linux/install-systemd-user.sh
          cfg="$RUNNER_TEMP/launcher cfg dir"
          mkdir -p "$cfg" "$RUNNER_TEMP/unit"
          cp examples/config.yaml "$cfg/config.yaml"
          bash examples/launchers/linux/install-systemd-user.sh --print \
            --cli "$PWD/dist/cli.js" --config "$cfg/config.yaml" \
            --updraft-home "$RUNNER_TEMP/launcher updraft home" > "$RUNNER_TEMP/unit/updraft.service"
          cat "$RUNNER_TEMP/unit/updraft.service"
          systemd-analyze verify "$RUNNER_TEMP/unit/updraft.service"

  # Updraft Cloud (cloud/): its own npm project, so the CLI matrix above never installs it. Not one
  # of the required checks on main; the deploy workflows run the same steps before deploying.
  cloud:
    name: cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - name: Validate the SAM template
        run: make validate-template
      - name: Dry-run the deploy targets
        run: |
          make -n deploy-backend APP_DOMAIN_NAME=updraft.readysetcloud.io APP_HOSTED_ZONE_ID=Z0000000000000 > /dev/null
          make -n deploy-frontend > /dev/null
